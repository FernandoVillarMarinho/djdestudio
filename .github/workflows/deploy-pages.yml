name: Deploy DJDE Studio (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Galeria DJDE (D1): só é ligada quando galeria/ tem catálogo aprovado.
      - name: Galeria DJDE
        run: |
          if [ -f galeria/generated-metadata/extensions-v0.json ]; then
            echo "DJDE_GALLERY_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/djdestudio/galeria/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
        env:
          NODE_ENV: production
          # site de projeto: https://<usuario>.github.io/djdestudio/
          STATIC_PATH: /djdestudio/static
          ROUTING_STYLE: filehash
          NODE_OPTIONS: --max-old-space-size=4096
      - run: touch build/.nojekyll
      - name: Publicar galeria DJDE
        run: |
          if [ -f galeria/generated-metadata/extensions-v0.json ]; then
            cp -r galeria build/galeria
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
